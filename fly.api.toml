app = "realm-labs-crm-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  build-target = "api"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WEB_ORIGIN = "https://realmlabscrm.com"
  ALLOWED_HOSTED_DOMAIN = "realmlabs.co"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
