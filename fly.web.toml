app = "realm-labs-crm-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  build-target = "web"
  [build.args]
    FLY_API_APP = "realm-labs-crm-api"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  FLY_API_APP = "realm-labs-crm-api"
  API_ORIGIN = "http://realm-labs-crm-api.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
